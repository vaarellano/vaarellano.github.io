    // ─── HELPERS ──────────────────────────────────────────────────────────────────
    function getDailyChallenge() {
      const now = new Date();
      const day = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
      const set = DAILY_SETS[day % DAILY_SETS.length];
      return { ...set, day, itemIds: set.items };
    }

    function makeGrid(cols, rows) { return Array(cols * rows).fill(null); }

    function canPlace(grid, cols, rows, w, h, sc, sr) {
      if (sc + w > cols || sr + h > rows) return false;
      for (let r = sr; r < sr + h; r++)
        for (let c = sc; c < sc + w; c++)
          if (grid[r * cols + c] !== null) return false;
      return true;
    }

    function placeOnGrid(grid, cols, item, w, h, sc, sr) {
      const g = [...grid];
      for (let r = sr; r < sr + h; r++)
        for (let c = sc; c < sc + w; c++)
          g[r * cols + c] = { ...item, w, h, anchor: r === sr && c === sc };
      return g;
    }

    function countEmpty(grid) { return grid.filter(c => c === null).length; }

    function pickNextItem(bias, topGrid, botGrid, cutlery, diff) {
      const topEmpty = countEmpty(topGrid);
      const botEmpty = countEmpty(botGrid);
      const cutEmpty = cutlery.filter(c => c === null).length;

      let pool = ITEMS.filter(item => item.bias.includes(bias));

      if (botEmpty <= 2) pool = pool.filter(i => i.zone !== "bottom" || i.sizeC[0] * i.sizeC[1] <= botEmpty);
      if (topEmpty <= 2) pool = pool.filter(i => i.zone !== "top" || i.sizeC[0] * i.sizeC[1] <= topEmpty);
      if (cutEmpty === 0) pool = pool.filter(i => i.zone !== "cutlery");

      const weighted = [];
      pool.forEach(item => {
        let w = 2;
        if (item.zone === "bottom" && botEmpty > 4) w = 4;
        if (item.zone === "top" && topEmpty > 2) w = 4;
        if (item.zone === "cutlery" && cutEmpty > 0) w = 3;
        for (let i = 0; i < w; i++) weighted.push(item);
      });

      if (weighted.length === 0) {
        return ITEMS.filter(i => i.sizeC[0] * i.sizeC[1] === 1)[Math.floor(Math.random() * 5)];
      }
      return { ...weighted[Math.floor(Math.random() * weighted.length)], uid: Math.random() };
    }

    function calcScore(placements, timeLeft, difficulty, isComplete) {
      const diff = DIFFICULTIES[difficulty] || DIFFICULTIES.medium;
      let zoneScore = 0, correct = 0, wrongWay = 0;
      placements.forEach(({ item, zone, wasWrongWay }) => {
        const pts = (ZONE_PTS[zone] || {})[item.id] || 0;
        zoneScore += wasWrongWay ? Math.round(pts * 0.6) : pts;
        if (pts >= 85 && !wasWrongWay) correct++;
        if (wasWrongWay) wrongWay++;
      });
      const pct = placements.length > 0 ? zoneScore / (placements.length * 100) : 0;
      const speedBonus = Math.round(timeLeft * 3);
      const completionBonus = isComplete ? 500 : 0;
      const base = zoneScore + speedBonus + completionBonus;
      const total = Math.round(base * diff.multiplier);
      return { total, zoneScore, speedBonus, completionBonus, multiplier: diff.multiplier, pct, correct, placed: placements.length, wrongWay };
    }

    function getArchetype(pct) {
      return ARCHETYPES.find(a => pct * 100 >= a.min) || ARCHETYPES[ARCHETYPES.length - 1];
    }

    function buildShare(placements, arch, total, mode, day, difficulty, isComplete) {
      const diff = DIFFICULTIES[difficulty] || DIFFICULTIES.medium;
      const grid = placements.map(({ item, zone, wasWrongWay }) => {
        const pts = (ZONE_PTS[zone] || {})[item.id] || 0;
        if (wasWrongWay) return "🟧";
        return pts >= 85 ? "🟩" : pts >= 50 ? "🟨" : "🟥";
      });
      const rows = [];
      for (let i = 0; i < grid.length; i += 5) rows.push(grid.slice(i, i + 5).join(""));
      const hdr = mode === "daily" ? "RACK STACK Daily #" + day : "RACK STACK";
      const incomplete = isComplete ? "" : " (incomplete)";
      return hdr + " " + diff.emoji + arch.emoji + "\n" + diff.label + " - \"" + arch.title + "\"" + incomplete + " - " + total.toLocaleString() + " pts\n\n" + rows.join("\n") + "\n\nrackstack.game - can you do better?";
    }

    function RackGrid({ grid, cols, rows, currentItem, orientation, onCell }) {
      const [hov, setHov] = useState(null);
      const getSize = () => !currentItem ? [1,1] : (orientation === "correct" ? currentItem.sizeC : currentItem.sizeW);
      const inHov = (col, row) => {
        if (!hov || !currentItem) return false;
        const [w, h] = getSize();
        return col >= hov[0] && col < hov[0] + w && row >= hov[1] && row < hov[1] + h;
      };
      const hovFits = () => {
        if (!hov || !currentItem) return false;
        const [w, h] = getSize();
        return canPlace(grid, cols, rows, w, h, hov[0], hov[1]);
      };
      const fits = hovFits();
      const tap = (col, row) => {
        if (!currentItem || grid[row * cols + col] !== null) return;
        const [w, h] = getSize();
        if (!canPlace(grid, cols, rows, w, h, col, row)) return;
        onCell(col, row, w, h);
      };
      return (
        <div className="rack-grid" style={{ gridTemplateColumns: "repeat(" + cols + ",1fr)" }}>
          {Array.from({ length: rows * cols }).map((_, idx) => {
            const col = idx % cols, row = Math.floor(idx / cols);
            const cell = grid[idx];
            const hi = !cell && inHov(col, row);
            return (
              <div key={idx}
                className={"cell" + (cell ? " filled" : "") + (hi && fits ? " hfit" : "") + (hi && !fits ? " hnofit" : "")}
                style={cell ? { background: cell.color + "22", borderColor: cell.color + "55" } : {}}
                onMouseEnter={() => !cell && setHov([col, row])}
                onMouseLeave={() => setHov(null)}
                onClick={() => tap(col, row)}
              >
                {cell && cell.anchor && <span style={{ fontSize: 14 }}>{cell.emoji}</span>}
              </div>
            );
          })}
        </div>
      );
    }

    // ─── GAME ─────────────────────────────────────────────────────────────────────
    function GameScreen({ mode, difficulty, dailyChallenge, onFinish }) {
      const diff = DIFFICULTIES[difficulty] || DIFFICULTIES.medium;
      const { botCols, botRows, topCols, topRows, cutSlots, timer, itemBias } = diff;

      const [topGrid, setTopGrid] = useState(() => makeGrid(topCols, topRows));
      const [botGrid, setBotGrid] = useState(() => makeGrid(botCols, botRows));
      const [cutlery, setCutlery] = useState(Array(cutSlots).fill(null));
      const [timeLeft, setTimeLeft] = useState(timer);
      const [placements, setPlacements] = useState([]);
      const [orient, setOrient] = useState("correct");
      const [toast, setToast] = useState(null);
      const [toastKey, setToastKey] = useState(0);
      const [washing, setWashing] = useState(false);
      const [current, setCurrent] = useState(null);
      const timerRef = useRef(null);
      const doneRef = useRef(false);

      const filled = (topCols * topRows) - countEmpty(topGrid)
        + (botCols * botRows) - countEmpty(botGrid)
        + cutSlots - cutlery.filter(c => c === null).length;
      const total = topCols * topRows + botCols * botRows + cutSlots;
      const fillPct = filled / total;
      const isComplete = fillPct >= 1;

      useEffect(() => {
        setCurrent(pickNextItem(itemBias, makeGrid(topCols, topRows), makeGrid(botCols, botRows), Array(cutSlots).fill(null), difficulty));
      }, []);

      useEffect(() => {
        timerRef.current = setInterval(() => setTimeLeft(t => t > 0 ? t - 1 : 0), 1000);
        return () => clearInterval(timerRef.current);
      }, []);

      useEffect(() => {
        if ((timeLeft === 0 || isComplete) && !doneRef.current) {
          doneRef.current = true;
          clearInterval(timerRef.current);
          setWashing(true);
        }
      }, [timeLeft, isComplete]);

      const showToast = (pts, ww) => {
        const msg = pts >= 85 ? (ww ? "⚠️ Sideways!" : "✅ Perfect!") : pts >= 50 ? "👍 Okay…" : pts > 0 ? "⚠️ Wrong rack" : "❌ Bad spot!";
        const color = pts >= 85 ? (ww ? "#F4A261" : "#4CAF82") : pts >= 50 ? "#F4A261" : "#E07A5F";
        setToast({ msg, color });
        setToastKey(k => k + 1);
        setTimeout(() => setToast(null), 1050);
      };

      const afterPlace = (newTop, newBot, newCut, item, zone, ww) => {
        const pts = (ZONE_PTS[zone] || {})[item.id] || 0;
        showToast(pts, ww);
        setPlacements(p => [...p, { item, zone, wasWrongWay: ww || false }]);
        setOrient("correct");
        const next = pickNextItem(itemBias, newTop, newBot, newCut, difficulty);
        setCurrent(next);
      };

      const handleTop = (col, row, w, h) => {
        if (!current) return;
        const newGrid = placeOnGrid(topGrid, topCols, current, w, h, col, row);
        setTopGrid(newGrid);
        afterPlace(newGrid, botGrid, cutlery, current, "top", false);
      };

      const handleBot = (col, row, w, h) => {
        if (!current) return;
        const newGrid = placeOnGrid(botGrid, botCols, current, w, h, col, row);
        setBotGrid(newGrid);
        afterPlace(topGrid, newGrid, cutlery, current, "bottom", orient === "wrong");
      };

      const handleCut = (i) => {
        if (!current || cutlery[i]) return;
        const newCut = [...cutlery];
        newCut[i] = current;
        setCutlery(newCut);
        afterPlace(topGrid, botGrid, newCut, current, "cutlery", false);
      };

      const finishEarly = () => {
        if (!doneRef.current) {
          doneRef.current = true;
          clearInterval(timerRef.current);
          setWashing(true);
        }
      };

      const timerPct = timeLeft / timer;
      const tc = timerPct > .5 ? "#4CAF82" : timerPct > .25 ? "#F4A261" : "#E07A5F";
      const curSz = current ? (orient === "correct" ? current.sizeC : current.sizeW) : [1, 1];
      const emptyLeft = total - filled;

      return (
        <div style={{ width: "100%", maxWidth: 430, padding: "12px 14px" }}>
          {toast && <div key={toastKey} className="toast" style={{ background: toast.color, color: "#fff" }}>{toast.msg}</div>}
          {washing && <WashAnimation onDone={() => onFinish(placements, timeLeft, difficulty, isComplete)} />}

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div className="logo" style={{ fontSize: 20 }}>RACK STACK</div>
              <div style={{ fontSize: 11, fontWeight: 800, color: diff.color, background: diff.color + "22", padding: "3px 8px", borderRadius: 20, border: "1px solid " + diff.color + "44" }}>
                {diff.emoji} {diff.label.toUpperCase()}
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontWeight: 800, fontSize: 19, color: tc, fontFamily: "monospace" }}>
                {String(Math.floor(timeLeft / 60)).padStart(2, "0")}:{String(timeLeft % 60).padStart(2, "0")}
              </div>
              <div style={{ fontSize: 9, color: "var(--silver)", fontWeight: 600 }}>{emptyLeft} slots left</div>
            </div>
          </div>

          <div className="timer-bar" style={{ marginBottom: 8 }}>
            <div className="timer-fill" style={{ width: (timerPct * 100) + "%", background: tc }} />
          </div>

          {mode === "daily" && dailyChallenge && (
            <div style={{ background: "#0e1e30", border: "1px solid var(--blue)", borderRadius: 7, padding: "6px 12px", marginBottom: 8, display: "flex", gap: 6, alignItems: "center" }}>
              <span style={{ fontSize: 12 }}>⚡</span>
              <span style={{ fontSize: 10, fontWeight: 800, color: "var(--blue)" }}>{dailyChallenge.name}</span>
              <span style={{ fontSize: 9, color: "var(--silver)", marginLeft: "auto" }}>{dailyChallenge.restriction}</span>
            </div>
          )}

          {current ? (
            <div className="pb" style={{ background: "var(--panel)", borderRadius: 13, padding: "10px 13px", marginBottom: 8, border: "2px solid " + current.color + "44" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ fontSize: 38, lineHeight: 1 }}>{current.emoji}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 800, fontSize: 14 }}>{current.name}</div>
                  <div style={{ fontSize: 11, color: "var(--silver)", fontWeight: 600, marginTop: 1 }}>{current.desc}</div>
                  {current.orientable && (
                    <div style={{ marginTop: 3, fontSize: 10, fontWeight: 700, color: orient === "wrong" ? "var(--accent)" : "var(--green)" }}>
                      {orient === "correct" ? "✅ " + curSz[0] + "x" + curSz[1] + " compact" : "⚠️ " + curSz[0] + "x" + curSz[1] + " sideways"}
                    </div>
                  )}
                </div>
                {current.orientable && (
                  <button className="btn-rot" onClick={() => setOrient(o => o === "correct" ? "wrong" : "correct")}>
                    🔄 Rotate
                  </button>
                )}
              </div>
            </div>
          ) : (
            <div style={{ background: "var(--panel)", borderRadius: 13, padding: "10px 13px", marginBottom: 8, opacity: .4, textAlign: "center" }}>
              <div style={{ fontWeight: 700, fontSize: 13 }}>Loading next item...</div>
            </div>
          )}

          <Dishwasher
            topGrid={topGrid} botGrid={botGrid} cutlery={cutlery}
            topCols={topCols} topRows={topRows}
            botCols={botCols} botRows={botRows}
            cutSlots={cutSlots}
            currentItem={current} orientation={orient}
            onTop={handleTop} onBot={handleBot} onCut={handleCut}
            fillPct={fillPct}
          />

          {placements.length > 0 && (
            <div style={{ textAlign: "center", marginTop: 10 }}>
              <button className="btn btn-d" onClick={finishEarly} style={{ fontSize: 12, padding: "9px 18px" }}>
                Close and Wash
              </button>
            </div>
          )}
        </div>
      );
    }

    // ─── RESULTS ─────────────────────────────────────────────────────────────────

            <div style={{ marginTop: 8, display: "inline-flex", alignItems: "center", gap: 6, background: diff.color + "22", border: "1px solid " + diff.color + "44", borderRadius: 20, padding: "4px 12px" }}>
              <span style={{ fontSize: 13 }}>{diff.emoji}</span>
              <span style={{ fontSize: 11, fontWeight: 800, color: diff.color }}>{diff.label} — {diff.multiplier}x multiplier</span>
            </div>
          </div>

          <div className="card" style={{ textAlign: "center", marginBottom: 12 }}>
            <div style={{ fontSize: 38, fontWeight: 900 }}>{sd.total.toLocaleString()}<span style={{ fontSize: 12, color: "var(--silver)", marginLeft: 4 }}>pts</span></div>
            <div style={{ fontSize: 10, color: "var(--silver)", fontWeight: 700, marginBottom: 12 }}>{sd.correct}/{sd.placed} perfect placements</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 6 }}>
              {[
                ["Zone", sd.zoneScore],
                ["Speed", "+" + sd.speedBonus],
                ["Complete", isComplete ? "+500" : "—"],
                [diff.multiplier + "x", "multiplier"],
              ].map(([l, v]) => (
                <div key={l} style={{ background: "#0f1318", borderRadius: 8, padding: "8px 3px" }}>
                  <div style={{ fontSize: 13, fontWeight: 900 }}>{v}</div>
                  <div style={{ fontSize: 7, color: "var(--silver)", fontWeight: 700, textTransform: "uppercase" }}>{l}</div>
                </div>
              ))}
            </div>
            {sd.wrongWay > 0 && <div style={{ marginTop: 8, fontSize: 11, color: "var(--accent)", fontWeight: 700 }}>⚠️ {sd.wrongWay} item{sd.wrongWay > 1 ? "s" : ""} placed sideways</div>}
          </div>

          {!saved ? (
            <div className="card" style={{ marginBottom: 12 }}>
              <div style={{ fontWeight: 700, marginBottom: 8, fontSize: 13 }}>Add to Global Rankings</div>
              <div style={{ display: "flex", gap: 7 }}>
                <input value={name} onChange={e => setName(e.target.value)} onKeyDown={e => e.key === "Enter" && save()}
                  placeholder="Your name" maxLength={20}
                  style={{ flex: 1, padding: "9px 11px", borderRadius: 8, border: "2px solid var(--border)", background: "#0f1318", color: "var(--cream)", fontFamily: "'Nunito',sans-serif", fontSize: 13, outline: "none" }} />
                <button className="btn btn-p" onClick={save} style={{ padding: "9px 14px", fontSize: 13 }}>Save</button>
              </div>
            </div>
          ) : (
            <div style={{ textAlign: "center", color: "var(--green)", fontWeight: 800, fontSize: 13, marginBottom: 12 }}>Saved to leaderboard!</div>
          )}

          <div className="card" style={{ marginBottom: 12 }}>
            <div style={{ fontWeight: 700, marginBottom: 8, fontSize: 13 }}>Share Your Result</div>
            <div className="tabs" style={{ marginBottom: 8 }}>
              {[["x", "X Twitter"], ["ig", "Instagram"], ["copy", "Copy"]].map(([id, l]) => (
                <button key={id} className={"tab" + (tab === id ? " active" : "")} onClick={() => setTab(id)}>{l}</button>
              ))}
            </div>
            {tab === "x" && <a href={twUrl} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none" }}><button className="btn btn-k" style={{ width: "100%", borderRadius: 10, fontSize: 14, padding: "11px" }}>Post on X (Twitter)</button></a>}
            {tab === "ig" && <div><div className="share-pre" style={{ marginBottom: 7 }}>{shareText}</div><button className="btn btn-d" onClick={copy} style={{ width: "100%", fontSize: 12, padding: "10px" }}>Copy for Instagram Story</button></div>}
            {tab === "copy" && <div><div className="share-pre" style={{ marginBottom: 7 }}>{shareText}</div><button className="btn btn-p" onClick={copy} style={{ width: "100%", fontSize: 13, padding: "11px" }}>{copied ? "Copied!" : "Copy to Clipboard"}</button></div>}
          </div>

          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn btn-d" onClick={onLeaderboard} style={{ flex: 1, fontSize: 12, padding: "11px" }}>🏆 Rankings</button>
            <button className="btn btn-p" onClick={onPlayAgain} style={{ flex: 1, fontSize: 14, padding: "11px" }}>Play Again</button>
          </div>
        </div>
      );
    }

    // ─── PARTNER ─────────────────────────────────────────────────────────────────
    function PartnerScreen({ onStart, onBack, difficulty }) {
      const [code] = useState(() => Math.random().toString(36).slice(2, 7).toUpperCase());
      const [copied, setCopied] = useState(false);
      const diff = DIFFICULTIES[difficulty] || DIFFICULTIES.medium;
      const link = window.location.href.split("?")[0] + "?vs=" + code;
      const msg = "Think you load a dishwasher better than me? Challenge me on Rack Stack (" + diff.label + " mode): " + link + " #RackStack";
      const twUrl = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(msg);
      const copy = () => { navigator.clipboard.writeText(msg); setCopied(true); setTimeout(() => setCopied(false), 2000); };
      return (
        <div style={{ maxWidth: 400, width: "100%", padding: "24px 18px" }}>
          <div style={{ textAlign: "center", marginBottom: 18 }}>
            <div className="logo" style={{ fontSize: 38, marginBottom: 4 }}>PARTNER<br />MODE</div>
            <p style={{ color: "var(--silver)", fontSize: 13, fontWeight: 600, lineHeight: 1.6 }}>Same load. Same dishes. Same difficulty. Who actually knows how to load this thing?</p>
            <div style={{ marginTop: 8, display: "inline-flex", alignItems: "center", gap: 6, background: diff.color + "22", border: "1px solid " + diff.color + "44", borderRadius: 20, padding: "4px 12px" }}>
              <span style={{ fontSize: 13 }}>{diff.emoji}</span>
              <span style={{ fontSize: 11, fontWeight: 800, color: diff.color }}>{diff.label} Mode</span>
            </div>
          </div>
          <div className="pglow" style={{ marginBottom: 12, textAlign: "center" }}>
            <div style={{ fontSize: 9, fontWeight: 800, letterSpacing: ".24em", color: "var(--blue)", marginBottom: 5 }}>YOUR ROOM CODE</div>
            <div style={{ fontSize: 48, fontWeight: 900, letterSpacing: ".2em", margin: "8px 0", color: "var(--cream)" }}>{code}</div>
            <div style={{ fontSize: 10, color: "var(--silver)", fontWeight: 600 }}>Partner enters this to play the same load</div>
          </div>
          <div className="card" style={{ marginBottom: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 12, marginBottom: 8 }}>Send the Challenge</div>
            <div style={{ background: "#0f1318", borderRadius: 7, padding: "8px 11px", fontSize: 10, color: "var(--silver)", fontFamily: "monospace", marginBottom: 8, wordBreak: "break-all" }}>{link}</div>
            <div style={{ display: "flex", gap: 7 }}>
              <button className="btn btn-d" onClick={copy} style={{ flex: 1, fontSize: 11, padding: "10px 6px" }}>{copied ? "Copied!" : "Copy Challenge"}</button>
              <a href={twUrl} target="_blank" rel="noopener noreferrer" style={{ flex: 1, textDecoration: "none" }}>
                <button className="btn btn-k" style={{ width: "100%", borderRadius: 10, fontSize: 11, fontFamily: "'Nunito',sans-serif", fontWeight: 800, padding: "10px 0", cursor: "pointer", border: "none" }}>Post on X</button>
              </a>
            </div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn btn-d" onClick={onBack} style={{ flex: 1, fontSize: 12, padding: "11px" }}>Back</button>
            <button className="btn btn-g" onClick={() => onStart("partner", difficulty)} style={{ flex: 1, fontSize: 14 }}>Play Now</button>
          </div>
        </div>
      );
    }

    // ─── LEADERBOARD ─────────────────────────────────────────────────────────────
    function LeaderboardScreen({ onBack }) {
      const [entries, setEntries] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filter, setFilter] = useState("all");

      useEffect(() => {
        try {
          const raw = localStorage.getItem("rackstack_lb");
          setEntries(raw ? JSON.parse(raw) : []);
        } catch (e) { setEntries([]); }
        setLoading(false);
      }, []);

      const filtered = filter === "all" ? entries : entries.filter(e => (e.difficulty || "medium") === filter);
      let avg = 0, topType = "None";
      if (entries.length > 0) {
        avg = Math.round(entries.reduce((s, e) => s + e.score, 0) / entries.length);
        const counts = {};
        entries.forEach(e => { counts[e.archetype] = (counts[e.archetype] || 0) + 1; });
        const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
        if (sorted.length > 0) topType = sorted[0][0];
      }

      return (
        <div style={{ maxWidth: 400, width: "100%", padding: "24px 18px" }}>
          <div style={{ textAlign: "center", marginBottom: 16 }}>
            <div className="logo" style={{ fontSize: 46, marginBottom: 2 }}>RANKINGS</div>
            <p style={{ color: "var(--silver)", fontSize: 11, fontWeight: 600 }}>{entries.length} players worldwide</p>
          </div>
          {entries.length > 0 && (
            <div className="card" style={{ marginBottom: 11, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 9, textAlign: "center" }}>
              <div><div style={{ fontSize: 16, fontWeight: 900 }}>{entries.length}</div><div style={{ fontSize: 8, color: "var(--silver)", fontWeight: 700, textTransform: "uppercase" }}>Players</div></div>
              <div><div style={{ fontSize: 16, fontWeight: 900 }}>{avg.toLocaleString()}</div><div style={{ fontSize: 8, color: "var(--silver)", fontWeight: 700, textTransform: "uppercase" }}>Avg Score</div></div>
              <div><div style={{ fontSize: 12, fontWeight: 900, lineHeight: 1.2 }}>{topType.split(" ").slice(-1)[0]}</div><div style={{ fontSize: 8, color: "var(--silver)", fontWeight: 700, textTransform: "uppercase" }}>Top Type</div></div>
            </div>
          )}
          <div className="tabs" style={{ marginBottom: 10 }}>
            {[["all", "All"], ["easy", "🟢 Easy"], ["medium", "🟡 Medium"], ["hard", "🔴 Hard"]].map(([id, l]) => (
              <button key={id} className={"tab" + (filter === id ? " active" : "")} onClick={() => setFilter(id)}>{l}</button>
            ))}
          </div>
          {loading ? (
            <div style={{ textAlign: "center", color: "var(--silver)", padding: 36, fontWeight: 700 }}>Loading…</div>
          ) : filtered.length === 0 ? (
            <div className="card" style={{ textAlign: "center", padding: 32, color: "var(--silver)" }}><div style={{ fontSize: 32, marginBottom: 7 }}>🍽️</div>No scores yet.</div>
          ) : (
            filtered.slice(0, 20).map((e, i) => {
              const ac = (ARCHETYPES.find(a => a.title === e.archetype) || {}).color || "var(--silver)";
              const dEmoji = e.diffEmoji || "🟡";
              return (
                <div key={i} className="lb-row" style={{ borderLeft: "4px solid " + ac }}>
                  <div style={{ fontWeight: 900, fontSize: 14, width: 24, color: i < 3 ? "var(--gold)" : "var(--silver)" }}>
                    {i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : "#" + (i + 1)}
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 800, fontSize: 13 }}>{e.name}</div>
                    <div style={{ fontSize: 9, color: "var(--silver)", fontWeight: 700 }}>
                      {e.emoji} {e.archetype} · {dEmoji} {e.diffLabel || "Medium"}
                      {e.isComplete ? " ✅" : " ⚠️"}
                      {e.mode === "daily" ? " · 📅" : ""}
                    </div>
                  </div>
                  <div style={{ fontWeight: 900, fontSize: 15 }}>{e.score.toLocaleString()}</div>
                </div>
              );
            })
          )}
          <div style={{ marginTop: 16, textAlign: "center" }}>
            <button className="btn btn-d" onClick={onBack} style={{ fontSize: 12, padding: "11px 24px" }}>Back</button>
          </div>
        </div>
      );
    }

    // ─── ROOT ─────────────────────────────────────────────────────────────────────
    function RackStack() {
      const [screen, setScreen] = useState("landing");
      const [mode, setMode] = useState("solo");
      const [difficulty, setDifficulty] = useState("medium");
      const [result, setResult] = useState(null);
      const daily = getDailyChallenge();

      const handleMode = (m, diff) => {
        setDifficulty(diff || "medium");
        if (m === "leaderboard") { setScreen("leaderboard"); return; }
        if (m === "partner") { setScreen("partner"); return; }
        setMode(m); setScreen("game");
      };

      const handleFinish = (placements, timeLeft, diff, isComplete) => {
        setResult({ placements, timeLeft, difficulty: diff, isComplete });
        setScreen("results");
      };

      return (
        <>
          <style>{css}</style>
          <FontLoader />
          <div className="app">
            {screen === "landing" && <LandingScreen onMode={handleMode} />}
            {screen === "partner" && <PartnerScreen onStart={handleMode} onBack={() => setScreen("landing")} difficulty={difficulty} />}
            {screen === "game" && (
              <GameScreen
                key={String(Date.now())}
                mode={mode}
                difficulty={difficulty}
                dailyChallenge={mode === "daily" ? daily : null}
                onFinish={handleFinish}
              />
            )}
            {screen === "results" && result && (
              <ResultsScreen
                placements={result.placements}
                timeLeft={result.timeLeft}
                difficulty={result.difficulty}
                isComplete={result.isComplete}
                mode={mode}
                dailyDay={daily.day}
                onPlayAgain={() => { setResult(null); setScreen("landing"); }}
                onLeaderboard={() => setScreen("leaderboard")}
              />
            )}
            {screen === "leaderboard" && (
              <LeaderboardScreen onBack={() => setScreen(result ? "results" : "landing")} />
            )}
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<RackStack />);
  </script>
</body>
</html>
