<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiment Planner — A/B Test Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <!-- Plain JS (no JSX) — must load before Babel scripts -->
  <script src="js/stats.js"></script>
  <script src="js/claude.js"></script>
  <!-- React components — loaded in dependency order -->
  <script type="text/babel" data-presets="react" src="js/charts.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/wizard.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/results.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/app.jsx"></script>
</body>
</html>
